# Broker config for the fleet bus.
#
#   mosquitto -c config/mosquitto.conf -v
#
# Mosquitto 2.x changed two defaults that between them make a fresh install
# look broken: it binds to localhost only, and it refuses anonymous clients.
# A broker started without a config file therefore accepts nothing from another
# machine, with no obvious error on the client side -- the connection is simply
# refused. Both are set explicitly below.

# 0.0.0.0 so the laptop can reach a broker running on the MAiRA workstation.
# On a lab network behind a firewall this is what you want; on anything
# public, add the password_file lines at the bottom.
listener 1883 0.0.0.0

# No authentication. Fine on an isolated cell network, not fine otherwise --
# anyone who can reach port 1883 can command every robot on the bus.
allow_anonymous true

# Retained state must survive a broker restart, or a scheduler that reconnects
# after one sees no robots at all until each agent next publishes.
persistence true
persistence_location /tmp/mosquitto/

# A robot that stops answering should be declared dead in seconds, not minutes.
# Agents use keepalive 20, so the broker fires their will at ~30s worst case.
max_keepalive 60

log_dest stdout
log_type warning
log_type notice
connection_messages true

# ---------------------------------------------------------------------------
# Turning on authentication, once this leaves your bench:
#
#   mosquitto_passwd -c /opt/homebrew/etc/mosquitto/passwd fleet
#
# then replace allow_anonymous above with:
#   allow_anonymous false
#   password_file /opt/homebrew/etc/mosquitto/passwd
#
# and put "username"/"password" in the "broker" block of both config files.
# MqttTransport already passes them through.
# ---------------------------------------------------------------------------
